[project]
name = "bizdoctor-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2",
  "psycopg2-binary",
  "python-dotenv",
  "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
